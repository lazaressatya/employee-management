
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-management
  template:
    metadata:
      labels:
        app: employee-management
    spec:
      containers:
        - name: employee-management
          image: lazares/employee-management:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: employee-management-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: employee-management-secret
                  key: MONGODB_URI
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
